<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your Restaurant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero">

        <div class="language-switcher">
            <button id="englishButton">EN</button>
            <button id="arabicButton">العربية</button>
        </div>

        <div class="logo">
            <img src"logo.png" alt="Tacoshi logo">
        </div>

        <h1 id="restaurantName">
            Your Restaurant
        </h1>

        <p id="restaurantTagline">
            Premium Street Food
        </p>

    </header>


    <nav
        class="category-nav"
        id="categoryNav"
    >
    </nav>


    <main id="menu">
    </main>


    <footer>
        <p id="footerText">
            © 2026 Your Restaurant
        </p>
    </footer>


    <script src="app.js"></script>

</body>

</html>
